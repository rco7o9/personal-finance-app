# All ports bind to 127.0.0.1 only: the app has no authentication (single-household,
# local-only by design), so nothing should be reachable from the LAN.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pfa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agents:
    build:
      context: ./agents
      dockerfile: ../Dockerfile.agents.dev
    container_name: pfa_agents
    restart: unless-stopped
    environment:
      PORT: 3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ./agents:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend.dev
    container_name: pfa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3001
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      GOLD_API_KEY: ${GOLD_API_KEY}
      AGENT_SERVICE_URL: http://agents:3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      EMPLOYER_STOCK_INSTITUTION: ${EMPLOYER_STOCK_INSTITUTION:-Employer Stock Plan}
      EMPLOYER_STOCK_CATEGORY: ${EMPLOYER_STOCK_CATEGORY:-Employer RSU}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend:/app
      # Prevents the host's node_modules (macOS binaries) from overwriting
      # the container's node_modules (Linux binaries). Without this, you'll
      # get "exec format error" or missing binary errors at runtime.
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend.dev
    container_name: pfa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Used by server components (runs inside Docker network)
      API_URL: http://backend:3001
      # Used by client components (runs in the browser, must be localhost)
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: pfa_cloudbeaver
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

volumes:
  postgres_data:
  cloudbeaver_data:
